<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <title>Помічник</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <button id="save" class="big accent" data-nav data-autofocus>⭐ Зберегти це відео</button>
  <div id="msg" class="msg" role="status"></div>
  <button id="mine" class="big" data-nav>⭐ Мої відео</button>
  <h2 id="hist-title" hidden>▶ Нещодавно</h2>
  <div id="history"></div>
  <button id="settings" class="big muted small" data-nav>⚙ Налаштування</button>
  <button id="pause" class="big muted small" data-nav>⏸ Вимкнути до перезапуску Chrome</button>
  <div id="pause-note" class="hint" hidden>Помічник вимкнено. Після перезапуску Chrome він увімкнеться сам.</div>
  <script type="module" src="panel.js"></script>
</body>
</html>
